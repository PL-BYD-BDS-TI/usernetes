name: Release
on:
  push:
    tags:
      - 'v*'
env:
  DOCKER_BUILDKIT: 1
jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
      - name: "Build"
        run: make artifact
      - name: "Create release"
        uses: softprops/action-gh-release@v3
        with:
          working_directory: _artifact
          files: |
            usernetes-x86_64.tbz
            SHA256SUMS
          draft: true
          preserve_order: true
      - name: "Upload SHA256SUMS (artifact)"
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: _artifact/SHA256SUMS
